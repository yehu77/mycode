[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-claudecode"
version = "0.1.0"
description = "A Python Claude Code MVP inspired by Anthropic's Claude Code architecture."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0"]
openai = ["openai>=1.51.0"]
tui = ["textual>=0.79.0"]
mcp-remote = ["websockets>=12.0"]
all = ["anthropic>=0.34.0", "openai>=1.51.0", "textual>=0.79.0", "websockets>=12.0"]

[project.scripts]
pyclaude = "claudecode_py.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["claudecode_py*"]
